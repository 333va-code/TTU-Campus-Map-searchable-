<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTU Campus Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
      background: #000;
    }
    .custom-pin-label {
      background: transparent;
      border: none;
    }
    #search-container {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: 360px;
      max-width: calc(100vw - 80px);
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      padding: 2px 8px;
    }
    #search-input {
      width: 100%;
      border: none;
      outline: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 8px;
      background: transparent;
    }
    #clear-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #70757a;
      display: none;
      padding: 4px 8px;
    }
    #clear-btn:hover {
      color: #202124;
    }
  </style>
</head>
<body>
  <div id="search-container">
    <input type="text" id="search-input" placeholder="Search campus locations..." />
    <button id="clear-btn" aria-label="Clear search">&times;</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
